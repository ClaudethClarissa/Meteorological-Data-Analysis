name: Validate and render climate notebooks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy matplotlib seaborn statsmodels nbconvert ipykernel
      - name: Run tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Execute notebooks and save their outputs
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/01_data_cleaning_eda.ipynb --ExecutePreprocessor.timeout=180
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/02_time_series_analysis.ipynb --ExecutePreprocessor.timeout=180
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/03_reproducible_monthly_summary.ipynb --ExecutePreprocessor.timeout=180
      - name: Validate annotated notebooks from the author's original work
        run: |
          python -m jupyter nbconvert --to notebook --execute notebooks/01_original_eda_annotated.ipynb --output /tmp/eda-validated.ipynb --ExecutePreprocessor.timeout=300
          python -m jupyter nbconvert --to notebook --execute notebooks/02_original_time_series_annotated.ipynb --output /tmp/time-series-validated.ipynb --ExecutePreprocessor.timeout=300
      - name: Publish visible notebook results to this PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/01_data_cleaning_eda.ipynb notebooks/02_time_series_analysis.ipynb notebooks/03_reproducible_monthly_summary.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Save executed notebook outputs for GitHub preview"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
