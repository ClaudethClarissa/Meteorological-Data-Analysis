name: Validate and render climate notebooks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy matplotlib seaborn statsmodels nbconvert ipykernel
      - name: Run tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Validate annotated notebooks from the author's original work
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace BD_Climatologica_Navojoa.ipynb --ExecutePreprocessor.timeout=300
          python -m jupyter nbconvert --to notebook --execute --inplace Climatologia_Navojoa_Series_Tiempo.ipynb --ExecutePreprocessor.timeout=300
