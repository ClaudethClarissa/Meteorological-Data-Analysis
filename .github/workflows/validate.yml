name: Validate and render climate notebooks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy matplotlib seaborn statsmodels nbconvert ipykernel
      - name: Run tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Execute compact notebooks to validate their outputs
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/01_data_cleaning_eda.ipynb --ExecutePreprocessor.timeout=180
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/02_time_series_analysis.ipynb --ExecutePreprocessor.timeout=180
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/03_reproducible_monthly_summary.ipynb --ExecutePreprocessor.timeout=180
      - name: Validate annotated notebooks from the author's original work
        run: |
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/01_original_eda_annotated.ipynb --ExecutePreprocessor.timeout=300
          python -m jupyter nbconvert --to notebook --execute --inplace notebooks/02_original_time_series_annotated.ipynb --ExecutePreprocessor.timeout=300
